services:
  mysql:
    image: mysql:8.4
    container_name: ai-cooker-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_cooker
      MYSQL_USER: ai_cooker
      MYSQL_PASSWORD: ai_cooker
      MYSQL_ROOT_PASSWORD: ai_cooker_root
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 本机已有 MySQL 时可改用其他端口：MYSQL_PORT=3307 docker compose up -d mysql
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
